name: Deploy SCC Web Design only

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: sccwebdesign-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Safe restore to sccwebdesign.co.uk
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
      SSH_PASSWORD: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
      SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
      TARGET_DIR: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Create private Site Factory config
        shell: bash
        run: |
          cat > scc-private-config.php <<'PHP'
          <?php
          return [
              'token' => '${{ secrets.SITE_FACTORY_GITHUB_TOKEN }}',
              'repo' => '${{ secrets.SITE_FACTORY_REPO }}',
              'workflow' => '${{ secrets.SITE_FACTORY_WORKFLOW }}',
              'ref' => 'main',
          ];
          PHP

      - name: Safety checks before upload
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SCCWEBDESIGN_SSH_HOST}"
          : "${SSH_USERNAME:?Missing SCCWEBDESIGN_SSH_USERNAME}"
          : "${SSH_PASSWORD:?Missing SCCWEBDESIGN_SSH_PASSWORD}"
          : "${SSH_PORT:?Missing SCCWEBDESIGN_SSH_PORT}"
          : "${TARGET_DIR:?Missing SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR}"

          case "$TARGET_DIR" in
            *sccwebdesign.co.uk*|*sccwebdesign*|*SccWebdesign*)
              echo "Target path appears to be for SCC Web Design."
              ;;
            *)
              echo "Refusing to deploy: SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR does not look like an SCC Web Design folder."
              echo "Current target value is masked by GitHub if secret-like, but it must contain sccwebdesign.co.uk or sccwebdesign."
              exit 1
              ;;
          esac

          test -f index.html
          grep -qi "SCC Web Design" index.html
          if grep -RqiE "AirQuality26|AQ26|sccairquality" -- . --exclude-dir=.git --exclude-dir=.github; then
            echo "Refusing to deploy: AQ26 / sccairquality text found in this repo."
            grep -RniE "AirQuality26|AQ26|sccairquality" -- . --exclude-dir=.git --exclude-dir=.github || true
            exit 1
          fi

      - name: Build upload payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy_payload deploy_payload.tar.gz
          mkdir -p deploy_payload
          cp -a \
            .htaccess \
            assets \
            showcase \
            builder-request.php \
            contact-submit.php \
            scc-private-config.php \
            contact.html \
            cookie-policy.html \
            favicon.ico \
            index.html \
            privacy.html \
            robots.txt \
            script.js \
            site.webmanifest \
            sitemap.xml \
            styles.css \
            website-builder.html \
            deploy_payload/
          tar -czf deploy_payload.tar.gz -C deploy_payload .
          echo "Payload ready:"
          tar -tzf deploy_payload.tar.gz | sed -n '1,120p'

      - name: Upload and replace live site safely
        shell: bash
        run: |
          set -euo pipefail
          export SSHPASS="$SSH_PASSWORD"
          SSH_BASE=(sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$SSH_USERNAME@$SSH_HOST")
          SCP_BASE=(sshpass -e scp -P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25)

          echo "Checking SSH and target directory..."
          "${SSH_BASE[@]}" "mkdir -p '$TARGET_DIR' && test -d '$TARGET_DIR' && echo SSH_OK"

          echo "Sending archive..."
          "${SCP_BASE[@]}" deploy_payload.tar.gz "$SSH_USERNAME@$SSH_HOST:/tmp/sccwebdesign-deploy.tar.gz"

          echo "Backing up existing site, clearing target and extracting SCC Web Design payload..."
          "${SSH_BASE[@]}" "set -euo pipefail
            TARGET='$TARGET_DIR'
            case \"\$TARGET\" in
              *sccwebdesign.co.uk*|*sccwebdesign*|*SccWebdesign*) ;;
              *) echo 'Remote guard refused unsafe target'; exit 1 ;;
            esac
            mkdir -p \"\$TARGET/_backups\"
            if [ -f \"\$TARGET/index.html\" ]; then
              TS=\$(date +%Y%m%d-%H%M%S)
              mkdir -p \"\$TARGET/_backups/pre-sccwebdesign-restore-\$TS\"
              cp -a \"\$TARGET/.\" \"\$TARGET/_backups/pre-sccwebdesign-restore-\$TS/\" 2>/dev/null || true
            fi
            find \"\$TARGET\" -mindepth 1 -maxdepth 1 ! -name '_backups' -exec rm -rf {} +
            tar -xzf /tmp/sccwebdesign-deploy.tar.gz -C \"\$TARGET\"
            rm -f /tmp/sccwebdesign-deploy.tar.gz
            test -f \"\$TARGET/index.html\"
            grep -qi 'SCC Web Design' \"\$TARGET/index.html\"
            if grep -RqiE 'AirQuality26|AQ26|sccairquality' \"\$TARGET\" --exclude-dir=_backups; then
              echo 'WARNING: AQ26 text remains in live target outside backups.'
              grep -RniE 'AirQuality26|AQ26|sccairquality' \"\$TARGET\" --exclude-dir=_backups || true
              exit 1
            fi
            echo 'REMOTE_RESTORE_OK'
          "

      - name: Final HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          html="$(curl -LfsS --max-time 30 https://sccwebdesign.co.uk/ || true)"
          if echo "$html" | grep -qi "SCC Web Design"; then
            echo "Live HTTP check passed: SCC Web Design detected."
          else
            echo "Live HTTP check could not confirm SCC Web Design. This may be cache/DNS/Cloudflare delay; remote upload already passed."
            echo "$html" | head -40 || true
          fi
