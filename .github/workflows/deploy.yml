name: Deploy SCC Web Design only

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: sccwebdesign-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload SCC Web Design to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for var in SSH_HOST SSH_USERNAME SSH_PASSWORD SSH_PORT HOSTINGER_PUBLIC_HTML_DIR; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Confirm target is SCC Web Design
        shell: bash
        env:
          HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          case "$HOSTINGER_PUBLIC_HTML_DIR" in
            *sccwebdesign*|*SccWebdesign*|*SCCWEBDESIGN*)
              echo "Target path appears to be for SCC Web Design."
              ;;
            *)
              echo "Refusing to deploy: SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR does not contain sccwebdesign."
              echo "Current target path ends with: ${HOSTINGER_PUBLIC_HTML_DIR: -80}"
              exit 1
              ;;
          esac

      - name: Prepare clean upload folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir -p _deploy
          rsync -a ./ _deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_deploy/' \
            --exclude '*.zip' \
            --exclude '*.log' \
            --exclude 'node_modules/' \
            --exclude '.DS_Store'
          test -f _deploy/index.html

      - name: Install deploy and media tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync imagemagick

      - name: Vendor first-party portfolio media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _deploy/assets/vendor _deploy/assets/evidence /tmp/scc-media

          fetch_webp() {
            url="$1"
            out="$2"
            tmp="/tmp/scc-media/$(basename "$out").source"
            curl -L --fail --retry 2 --connect-timeout 15 --max-time 60 "$url" -o "$tmp"
            convert "$tmp" -auto-orient -strip -resize '1800x1800>' -quality 82 "_deploy/assets/vendor/$out"
            test -s "_deploy/assets/vendor/$out"
          }

          fetch_webp "https://crsrendering.co.uk/wp-content/uploads/2023/11/PORTSMOUTH-ROAD-42a.jpg" "crs-hero.webp"
          fetch_webp "https://crsrendering.co.uk/wp-content/uploads/2015/11/3-Ab-3.jpg" "crs-project.webp"
          fetch_webp "https://www.pearlcarpentry.co.uk/images/n4.jpg" "pearl-staircase.webp"
          fetch_webp "https://www.pearlcarpentry.co.uk/images/n1.jpg" "pearl-kitchen.webp"
          fetch_webp "https://treevolution.uk/assets/img/site/tree-surgeon-working-at-height.webp" "treevolution-hero.webp"
          fetch_webp "https://treevolution.uk/assets/img/site/tree-removal-dismantling-crown.webp" "treevolution-project.webp"
          fetch_webp "https://static.wixstatic.com/media/50a7cd_b884b072773c4dca94f24efab6c373d6~mv2_d_2446_2446_s_4_2.jpg/v1/fill/w_900,h_900,al_c,q_85,enc_auto/50a7cd_b884b072773c4dca94f24efab6c373d6~mv2_d_2446_2446_s_4_2.jpg" "pelham-arms.webp"

          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/scc-media/crs-current.png https://crsrendering.co.uk/
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/scc-media/pearl-current.png https://www.pearlcarpentry.co.uk/
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/scc-media/crs-current.png https://crsrendering.co.uk/
            chromium-browser --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot=/tmp/scc-media/pearl-current.png https://www.pearlcarpentry.co.uk/
          else
            echo "No headless Chrome available for evidence capture."
            exit 1
          fi

          convert /tmp/scc-media/crs-current.png -strip -quality 82 _deploy/assets/evidence/crs-current.webp
          convert /tmp/scc-media/pearl-current.png -strip -quality 82 _deploy/assets/evidence/pearl-current.webp
          test -s _deploy/assets/evidence/crs-current.webp
          test -s _deploy/assets/evidence/pearl-current.webp

          echo "Vendored first-party media:"
          find _deploy/assets/vendor _deploy/assets/evidence -type f -maxdepth 2 -print

      - name: Test Hostinger SSH connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo SSH_OK && test -n '$TARGET' && pwd && whoami"

      - name: Create bounded production backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          BACKUP_NAME="backup-$(date -u +%Y%m%d-%H%M%S)"
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USERNAME@$SSH_HOST" \
            "set -e; mkdir -p '$TARGET' '$TARGET/_backups/$BACKUP_NAME'; find '$TARGET' -maxdepth 1 -mindepth 1 ! -name '_backups' -exec cp -a {} '$TARGET/_backups/$BACKUP_NAME/' \\; ; ls -1dt '$TARGET'/_backups/backup-* 2>/dev/null | tail -n +6 | xargs -r rm -rf"

      - name: Clean current live files
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USERNAME@$SSH_HOST" \
            "find '$TARGET' -maxdepth 1 -mindepth 1 ! -name '_backups' -exec rm -rf {} +"

      - name: Upload SCC Web Design files
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          RSYNC_RSH="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          rsync -az --exclude '_backups/' -e "$RSYNC_RSH" _deploy/ "$SSH_USERNAME@$SSH_HOST:$TARGET/"

      - name: Verify remote release files
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USERNAME@$SSH_HOST" \
            "test -s '$TARGET/index.html' && test -s '$TARGET/studio-2026.css' && test -s '$TARGET/assets/vendor/crs-hero.webp' && test -s '$TARGET/assets/evidence/crs-current.webp' && grep -q 'Design people' '$TARGET/index.html' && echo REMOTE_RELEASE_OK"

      - name: Check live homepage
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          code=$(curl -L -s -o /tmp/sccwebdesign-home.html -w "%{http_code}" "https://sccwebdesign.co.uk/" || true)
          echo "HTTP status: $code"
          case "$code" in
            200|301|302) ;;
            *) echo "Live homepage did not return an expected status."; exit 1 ;;
          esac
          grep -q "Design people" /tmp/sccwebdesign-home.html
          echo "LIVE_RELEASE_OK"
