name: Deploy SCC Web Design only

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

concurrency:
  group: sccwebdesign-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload SCC Web Design to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          missing=0
          for var in SSH_HOST SSH_USERNAME SSH_PASSWORD SSH_PORT HOSTINGER_PUBLIC_HTML_DIR; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Confirm target is SCC Web Design
        shell: bash
        env:
          HOSTINGER_PUBLIC_HTML_DIR: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          case "$HOSTINGER_PUBLIC_HTML_DIR" in
            *sccwebdesign*|*SccWebdesign*|*SCCWEBDESIGN*)
              echo "Target path appears to be for SCC Web Design."
              ;;
            *)
              echo "Refusing to deploy: SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR does not contain sccwebdesign."
              echo "Current target path ends with: ${HOSTINGER_PUBLIC_HTML_DIR: -80}"
              exit 1
              ;;
          esac

      - name: Prepare clean upload folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir -p _deploy
          rsync -a ./ _deploy/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_deploy/' \
            --exclude '*.zip' \
            --exclude '*.log' \
            --exclude 'node_modules/' \
            --exclude '.DS_Store'

          test -f _deploy/index.html
          echo "Prepared upload folder:"
          find _deploy -maxdepth 2 -type f | sort | sed 's#^_deploy/##' | head -200

      - name: Install SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass rsync

      - name: Test Hostinger SSH connection
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            "$SSH_USERNAME@$SSH_HOST" \
            "echo SSH_OK && test -n '$TARGET' && pwd && whoami"

      - name: Create bounded production backup
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          BACKUP_NAME="backup-$(date -u +%Y%m%d-%H%M%S)"
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USERNAME@$SSH_HOST" \
            "set -e; mkdir -p '$TARGET' '$TARGET/_backups/$BACKUP_NAME'; find '$TARGET' -maxdepth 1 -mindepth 1 ! -name '_backups' -exec cp -a {} '$TARGET/_backups/$BACKUP_NAME/' \\; ; ls -1dt '$TARGET'/_backups/backup-* 2>/dev/null | tail -n +6 | xargs -r rm -rf"

      - name: Clean current live files
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USERNAME@$SSH_HOST" \
            "find '$TARGET' -maxdepth 1 -mindepth 1 ! -name '_backups' -exec rm -rf {} +"

      - name: Upload SCC Web Design files
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          RSYNC_RSH="sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30"
          rsync -az --exclude '_backups/' -e "$RSYNC_RSH" _deploy/ "$SSH_USERNAME@$SSH_HOST:$TARGET/"

      - name: Verify remote release files
        shell: bash
        env:
          SSHPASS: ${{ secrets.SCCWEBDESIGN_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SCCWEBDESIGN_SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SCCWEBDESIGN_SSH_USERNAME }}
          SSH_PORT: ${{ secrets.SCCWEBDESIGN_SSH_PORT }}
          TARGET: ${{ secrets.SCCWEBDESIGN_HOSTINGER_PUBLIC_HTML_DIR }}
        run: |
          set -euo pipefail
          sshpass -e ssh -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USERNAME@$SSH_HOST" \
            "test -s '$TARGET/index.html' && test -s '$TARGET/studio-2026.css' && grep -q 'Design people' '$TARGET/index.html' && echo REMOTE_RELEASE_OK"

      - name: Check live homepage
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          code=$(curl -L -s -o /tmp/sccwebdesign-home.html -w "%{http_code}" "https://sccwebdesign.co.uk/" || true)
          echo "HTTP status: $code"
          case "$code" in
            200|301|302) ;;
            *) echo "Live homepage did not return an expected status."; exit 1 ;;
          esac
          grep -q "Design people" /tmp/sccwebdesign-home.html
          echo "LIVE_RELEASE_OK"
